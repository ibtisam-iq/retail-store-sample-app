# Deploys the UI service as an internet-facing AWS Network Load Balancer on EKS.
# Without the annotations below, EKS defaults to an internal NLB — EXTERNAL-IP stays <pending>.

service:
  type: LoadBalancer
  port: 80
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip" 
