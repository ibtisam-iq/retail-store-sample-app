# Deployed the UI service with an AWS ALB Ingress using the AWS Load Balancer Controller.
# Exposes the UI on HTTP/80 via internet-facing ALB; requires ALB controller installed in cluster.

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/liveness
  hosts:
    - "<YOUR_DOMAIN_OR_ALB_DNS>"
