# Deployed the orders service with in-cluster PostgreSQL backed by a PVC on bare-metal.
# Used local-path StorageClass (Rancher provisioner) — data persists across pod restarts.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: in-memory

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path
