# Scenario: DB=PostgreSQL + gp2 EBS PVC, Messaging=RabbitMQ + gp2 EBS PVC (EKS)
# Both DB and message queue use EBS gp2 volumes on EKS; full persistent stack without managed services.

app:
  persistence:
    provider: postgres
    secret:
      password: "orders123"

  messaging:
    provider: rabbitmq
    rabbitmq:
      secret:
        username: orders
        password: "orders123"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: gp2

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: gp2
