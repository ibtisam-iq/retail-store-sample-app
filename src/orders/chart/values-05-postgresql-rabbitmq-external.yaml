# Scenario: DB=external RDS PostgreSQL (no pod), Messaging=external RabbitMQ (no pod)
# Both backends are fully external; no StatefulSet is created inside the cluster.

app:
  persistence:
    provider: postgres
    endpoint: <RDS_ENDPOINT>:5432
    secret:
      password: "<REPLACE_ME>"

  messaging:
    provider: rabbitmq
    rabbitmq:
      addresses:
        - '<EXTERNAL_RABBITMQ_HOST>:5672'
      secret:
        username: orders
        password: "<REPLACE_ME>"

postgresql:
  create: false

rabbitmq:
  create: false
