# Deployed the orders service pointing to an externally managed PostgreSQL instance (e.g. RDS).
# postgresql.create is false — no in-cluster PostgreSQL pod created. Messaging stays in-memory.

app:
  persistence:
    provider: postgresql
    endpoint: "<EXTERNAL_POSTGRESQL_HOST>:5432"
    database: orders
    secret:
      create: true
      username: orders
      password: "<REPLACE_ME>"
  messaging:
    provider: in-memory

postgresql:
  create: false
