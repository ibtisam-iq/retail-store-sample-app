# Scenario: DB=in-cluster PostgreSQL + gp2 EBS PVC (EKS), Messaging=in-memory
# Used on EKS when a managed RDS is not yet available but data persistence is required.

app:
  persistence:
    provider: 'postgres'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "orders123"

  messaging:
    provider: 'in-memory'

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2
