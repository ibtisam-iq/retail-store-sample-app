# Deployed the orders service with in-cluster PostgreSQL (no PVC) and AWS SQS messaging.
# SQS requires no broker pod — credentials via IRSA (annotate serviceAccount below).
# Pre-requisite: SQS queue must exist; IRSA role must have sqs:SendMessage permission.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: sqs

postgresql:
  create: true
  persistentVolume:
    enabled: false

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<SQS_IRSA_ROLE_NAME>
