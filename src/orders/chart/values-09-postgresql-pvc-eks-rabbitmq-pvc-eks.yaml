# Scenario: DB=PostgreSQL + gp2 EBS PVC, Messaging=RabbitMQ + gp2 EBS PVC (EKS)
# Both DB and message queue use EBS gp2 volumes on EKS; full persistent stack without managed services.

app:
  persistence:
    provider: 'postgres'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "orders123"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      addresses: []
      secret:
        create: true
        name: orders-rabbitmq
        username: "guest"
        password: "guest"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2
