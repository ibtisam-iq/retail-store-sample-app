# Deployed the orders service with PostgreSQL on PVC (bare-metal, local-path) and RabbitMQ ephemeral.
# DB data persists across restarts; RabbitMQ messages are lost on pod restart.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: rabbitmq
    rabbitmq:
      addresses:
        - "amqp://orders:orders123@orders-rabbitmq:5672"
      secret:
        create: true
        username: orders
        password: "orders123"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path

rabbitmq:
  create: true
  persistentVolume:
    enabled: false
