# Scenario: DB=PostgreSQL + local-path PVC (bare-metal), Messaging=RabbitMQ (ephemeral)
# DB data persists across pod restarts; RabbitMQ messages are lost on restart.

app:
  persistence:
    provider: 'postgres'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "orders123"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      addresses: []
      secret:
        create: true
        name: orders-rabbitmq
        username: "guest"
        password: "guest"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path

rabbitmq:
  create: true
  persistentVolume:
    enabled: false
