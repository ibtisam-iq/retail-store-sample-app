# Scenario: DB=external RDS PostgreSQL (no pod), Messaging=external RabbitMQ (no pod)
# Both backends are fully external; no StatefulSet is created inside the cluster.

app:
  persistence:
    provider: 'postgres'
    endpoint: '<RDS_ENDPOINT>:5432'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "<REPLACE_ME>"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      addresses:
        - '<EXTERNAL_RABBITMQ_HOST>:5672'
      secret:
        create: true
        name: orders-rabbitmq
        username: "<REPLACE_ME>"
        password: "<REPLACE_ME>"

postgresql:
  create: false

rabbitmq:
  create: false

securityGroups:
  create: true
  securityGroupIds:
    - <SG_ID_ALLOWING_RDS_5432>
    - <SG_ID_ALLOWING_RABBITMQ_5672>
