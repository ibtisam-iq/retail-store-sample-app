# Scenario: DB=in-cluster PostgreSQL (ephemeral), Messaging=in-cluster RabbitMQ (ephemeral)
# Used for integration testing where neither DB nor message queue needs to survive restarts.

app:
  persistence:
    provider: 'postgres'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "orders123"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      addresses: []
      secret:
        create: true
        name: orders-rabbitmq
        username: "guest"
        password: "guest"

postgresql:
  create: true
  persistentVolume:
    enabled: false

rabbitmq:
  create: true
  persistentVolume:
    enabled: false
