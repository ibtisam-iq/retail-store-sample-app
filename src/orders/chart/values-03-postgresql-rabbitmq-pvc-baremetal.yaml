# Scenario: DB=PostgreSQL + local-path PVC, Messaging=RabbitMQ + local-path PVC (bare-metal)
# Both DB and message queue persist across pod restarts on bare-metal / kubeadm clusters.

app:
  persistence:
    provider: postgres
    secret:
      password: "orders123"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      # addresses:
      #  - "amqp://orders:orders123@orders-rabbitmq:5672"
      secret:
        username: orders
        password: "orders123"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: local-path

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: local-path
