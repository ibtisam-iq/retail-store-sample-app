# Scenario: DB=in-cluster PostgreSQL + local-path PVC (bare-metal), Messaging=in-memory
# Used on bare-metal / kubeadm clusters where local-path is the default StorageClass.

app:
  persistence:
    provider: 'postgres'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "orders123"

  messaging:
    provider: 'in-memory'

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path
