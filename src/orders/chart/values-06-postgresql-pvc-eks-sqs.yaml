# Deployed the orders service with PostgreSQL on gp2 EBS PVC (EKS) and AWS SQS messaging.
# Production-grade serverless messaging — no RabbitMQ pod to manage, EBS-backed DB.
# Pre-requisite: SQS queue must exist; IRSA role must have sqs:SendMessage permission.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: sqs
    sqs:
      topic: "orders-events"
      
postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<SQS_IRSA_ROLE_NAME>
