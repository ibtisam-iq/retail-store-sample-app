# Deployed the orders service with PostgreSQL on gp3 EBS PVC (EKS) and AWS SQS messaging.
# Production-grade serverless messaging — no RabbitMQ pod to manage, EBS-backed DB.
# Pre-requisite: SQS queue must exist; IRSA role must have sqs:SendMessage permission.

serviceAccount:
  create: false     # Reuse existing service account 
  name: "orders"

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: sqs
    sqs:
      topic: "orders-events"
      
postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp3
