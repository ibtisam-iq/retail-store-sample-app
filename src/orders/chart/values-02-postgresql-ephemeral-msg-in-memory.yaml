# Scenario: DB=in-cluster PostgreSQL (ephemeral, no PVC), Messaging=in-memory
# Used for local/bare-metal dev where DB persistence across restarts is not required.

app:
  persistence:
    provider: 'postgres'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "orders123"

  messaging:
    provider: 'in-memory'

postgresql:
  create: true
  persistentVolume:
    enabled: false
