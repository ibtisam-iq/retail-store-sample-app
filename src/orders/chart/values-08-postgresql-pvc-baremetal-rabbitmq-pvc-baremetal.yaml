# Deployed the orders service with both PostgreSQL and RabbitMQ backed by PVCs on bare-metal.
# Both use local-path StorageClass — data and messages persist across pod restarts.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: rabbitmq
    rabbitmq:
      addresses:
        - "amqp://orders:orders123@orders-rabbitmq:5672"
      secret:
        create: true
        username: orders
        password: "orders123"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: local-path
