# Scenario: DB=external RDS PostgreSQL (no pod), Messaging=in-cluster RabbitMQ + gp2 PVC (EKS)
# RDS handles the DB; RabbitMQ persists messages to EBS gp2 on EKS.

app:
  persistence:
    provider: 'postgres'
    endpoint: '<RDS_ENDPOINT>:5432'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "<REPLACE_ME>"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      addresses: []
      secret:
        create: true
        name: orders-rabbitmq
        username: "guest"
        password: "guest"

postgresql:
  create: false

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2

securityGroups:
  create: true
  securityGroupIds:
    - <SG_ID_ALLOWING_RDS_5432>
