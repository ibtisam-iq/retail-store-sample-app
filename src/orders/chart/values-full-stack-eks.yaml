# Deployed the orders service with full persistence on EKS: PostgreSQL + RabbitMQ, both with PVCs.
# Production-grade pattern — both stateful services use gp3 EBS volumes.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: rabbitmq
    rabbitmq:
      addresses:
        - "amqp://orders:orders123@orders-rabbitmq:5672"
      secret:
        create: true
        username: orders
        password: "orders123"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp3

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: gp3
