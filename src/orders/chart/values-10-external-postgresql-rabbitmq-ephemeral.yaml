# Scenario: DB=external RDS PostgreSQL (no pod), Messaging=in-cluster RabbitMQ (ephemeral)
# DB is managed by AWS RDS; RabbitMQ runs in-cluster without a PVC.

app:
  persistence:
    provider: 'postgres'
    endpoint: '<RDS_ENDPOINT>:5432'
    database: 'orders'
    secret:
      create: true
      name: orders-db
      username: orders
      password: "<REPLACE_ME>"

  messaging:
    provider: 'rabbitmq'
    rabbitmq:
      addresses: []
      secret:
        create: true
        name: orders-rabbitmq
        username: "guest"
        password: "guest"

postgresql:
  create: false

rabbitmq:
  create: true
  persistentVolume:
    enabled: false

securityGroups:
  create: true
  securityGroupIds:
    - <SG_ID_ALLOWING_RDS_5432>
