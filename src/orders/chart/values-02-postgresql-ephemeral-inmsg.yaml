# Deployed the orders service with in-cluster PostgreSQL (no PVC) and in-memory messaging.
# Data is lost on PostgreSQL pod restart. Messaging events are lost on orders pod restart.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: in-memory

postgresql:
  create: true
  persistentVolume:
    enabled: false
