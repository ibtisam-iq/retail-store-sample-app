# Deployed the orders service with both PostgreSQL and RabbitMQ backed by gp2 EBS PVCs on EKS.
# Both stateful components use EBS volumes — most durable in-cluster pattern for EKS.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: rabbitmq
    rabbitmq:
      addresses:
        - "amqp://orders:orders123@orders-rabbitmq:5672"
      secret:
        create: true
        username: orders
        password: "orders123"

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2

rabbitmq:
  create: true
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: gp2
