# Deployed the orders service with in-cluster PostgreSQL backed by a PVC on EKS.
# Used gp2 EBS StorageClass — data persists via EBS volume across pod restarts.

app:
  persistence:
    provider: postgresql
    secret:
      password: "orders123"
  messaging:
    provider: in-memory

postgresql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: gp2
