# Deployed the orders service with external RDS + SQS and a VPC SecurityGroupPolicy.
# SecurityGroupPolicy (AWS VPC CNI) assigns the pod a specific security group that has
# inbound rules open on port 5432 from the RDS security group — no broad VPC-level access.
# Pre-requisites: VPC CNI security groups for pods enabled on EKS cluster; sg-* IDs known.

app:
  persistence:
    provider: postgresql
    endpoint: "<RDS_ENDPOINT>:5432"
    database: orders
    secret:
      create: true
      username: orders
      password: "<REPLACE_ME>"
  messaging:
    provider: sqs

postgresql:
  create: false

securityGroups:
  create: true
  securityGroupIds:
    - "<POD_SECURITY_GROUP_ID>"

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<SQS_IRSA_ROLE_NAME>
