# Deployed the catalog service with an in-cluster MySQL pod backed by a PersistentVolumeClaim.
# Enabled persistent storage so catalog data survived pod restarts during testing.

app:
  persistence:
    provider: mysql
    secret:
      password: "catalog123"

mysql:
  create: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: ""
